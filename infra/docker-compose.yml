services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infosteed
      POSTGRES_PASSWORD: infosteed
      POSTGRES_DB: infosteed
    ports:
      - "54329:5432"
    volumes:
      - infosteed-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infosteed -d infosteed"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: infosteed
      MINIO_ROOT_PASSWORD: infosteed-video-secret
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - infosteed-minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      [
        "until mc alias set local http://minio:9000 infosteed infosteed-video-secret; do sleep 1; done; mc mb --ignore-existing local/infosteed-videos",
      ]

  kokoro:
    profiles: ["voiceover"]
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.4
    ports:
      - "58880:8880"
    environment:
      API_LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8880/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  infosteed-postgres:
  infosteed-minio:
