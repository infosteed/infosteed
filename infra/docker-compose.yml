services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: infosteed
      POSTGRES_PASSWORD: infosteed
      POSTGRES_DB: infosteed
    ports:
      - "54329:5432"
    volumes:
      - infosteed-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infosteed -d infosteed"]
      interval: 5s
      timeout: 5s
      retries: 12

  kokoro:
    profiles: ["voiceover"]
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.2.4
    ports:
      - "58880:8880"
    environment:
      API_LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8880/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  # Keep native development data stable when a debugger changes the Compose project name.
  infosteed-postgres:
    name: ${DEV_POSTGRES_VOLUME:-infra_infosteed-postgres}
