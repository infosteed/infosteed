title = "InfoSteed Gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "The Chrome extension manifest key is a public, stable extension identity."
paths = ['''^apps/extension/public/manifest\.json$''']

# The installer generates independent production RPC secrets. These exact values
# are a public development fixture and a nonfunctional production placeholder.
[[allowlists]]
description = "Public Garage development RPC fixture and nonfunctional production template placeholder"
regexTarget = "secret"
regexes = ['''^(0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef|REPLACE_WITH_64_HEXADECIMAL_CHARACTERS)$''']
