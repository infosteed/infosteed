name: Publish release

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      short_sha: ${{ steps.release.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          package_version=$(node -p "require('./package.json').version")
          if [[ $GITHUB_REF_NAME != v* || $version != "$package_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $package_version" >&2
            exit 1
          fi
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.sha)
          tag_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq .object.type)
          if [[ $tag_type != tag ]]; then
            echo "Release tags must be signed annotated tags" >&2
            exit 1
          fi
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .verification.verified)
          if [[ $verified != true ]]; then
            echo "GitHub did not verify the signature on $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-pnpm
      - run: corepack pnpm release-metadata:check -- --release-tag "$GITHUB_REF_NAME"
      - run: corepack pnpm check
      - run: corepack pnpm spdx:check
      - run: corepack pnpm notices:check
      - run: corepack pnpm audit --prod --audit-level high
      - name: Scan git history for secrets
        run: >-
          docker run --rm
          --volume "$PWD:/repo"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --redact --no-banner /repo
      - run: corepack pnpm extension:package -- --chrome-only
      - uses: anchore/sbom-action@v0
        with:
          path: apps/extension/dist/chrome
          format: cyclonedx-json
          output-file: artifacts/extension.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ github.sha }}
          path: |
            artifacts/extension-offline.zip
            artifacts/extension-store.zip
            artifacts/extension-checksums.sha256
            artifacts/extension-contents.txt
            artifacts/extension.cdx.json
          if-no-files-found: error
          retention-days: 7

  images:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
            context: .
          - name: web
            dockerfile: apps/web/Dockerfile
            context: .
          - name: video-render-worker
            dockerfile: apps/video-render-worker/Dockerfile
            context: .
          - name: transcription
            dockerfile: whisper/Dockerfile
            context: whisper
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: extension-${{ github.sha }}
          path: artifacts
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a release image
        env:
          IMAGE: ghcr.io/infosteed/infosteed-${{ matrix.name }}
          VERSION: ${{ needs.verify.outputs.version }}
          SHORT_SHA: ${{ needs.verify.outputs.short_sha }}
        run: |
          for tag in "$VERSION" "sha-$SHORT_SHA"; do
            if docker buildx imagetools inspect "$IMAGE:$tag" >/dev/null 2>&1; then
              echo "Release image already exists: $IMAGE:$tag" >&2
              exit 1
            fi
          done
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/infosteed/infosteed-${{ matrix.name }}
          tags: |
            type=raw,value=${{ needs.verify.outputs.version }}
            type=raw,value=sha-${{ needs.verify.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=InfoSteed ${{ matrix.name }}
            org.opencontainers.image.description=InfoSteed production ${{ matrix.name }} image
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-only
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=container-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.name }}
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/infosteed/infosteed-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/infosteed/infosteed-${{ matrix.name }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: /tmp/${{ matrix.name }}-trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          limit-severities-for-sarif: true
          exit-code: "1"

  release:
    needs: [verify, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: extension-${{ github.sha }}
          path: artifacts
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare release files
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          SHORT_SHA: ${{ needs.verify.outputs.short_sha }}
        run: |
          cp deploy/compose.production.yml deploy/compose.build.yml deploy/compose.ai-services.yml artifacts/
          cp deploy/Caddyfile deploy/Caddyfile.internal deploy/production.env.example artifacts/
          cp deploy/ai-services.env.example deploy/ai-services.connection.env.example artifacts/
          cp docs/deployment.md docs/ai-services.md docs/internal-https.md docs/deployment-troubleshooting.md artifacts/
          cp scripts/production-compose.sh scripts/ai-common.sh scripts/deploy-production.sh artifacts/
          cp scripts/install-production.sh scripts/configure-ai-services.sh scripts/install-ai-services.sh artifacts/
          cp scripts/doctor-production.sh scripts/doctor-ai-services.sh scripts/backup.sh scripts/restore.sh scripts/upgrade-production.sh artifacts/
          cp THIRD_PARTY_NOTICES.md LICENSE CHANGELOG.md artifacts/
          tar -czf "artifacts/infosteed-deployment-$VERSION.tar.gz" \
            deploy/compose.production.yml deploy/compose.build.yml deploy/compose.ai-services.yml \
            deploy/Caddyfile deploy/Caddyfile.internal deploy/production.env.example \
            deploy/ai-services.env.example deploy/ai-services.connection.env.example \
            scripts/production-compose.sh scripts/ai-common.sh scripts/deploy-production.sh \
            scripts/install-production.sh scripts/configure-ai-services.sh scripts/install-ai-services.sh \
            scripts/doctor-production.sh scripts/doctor-ai-services.sh scripts/backup.sh scripts/restore.sh scripts/upgrade-production.sh \
            docs/deployment.md docs/ai-services.md docs/internal-https.md docs/deployment-troubleshooting.md docs/backup-and-upgrade.md
          web=ghcr.io/infosteed/infosteed-web:$VERSION
          api=ghcr.io/infosteed/infosteed-api:$VERSION
          render=ghcr.io/infosteed/infosteed-video-render-worker:$VERSION
          transcription=ghcr.io/infosteed/infosteed-transcription:$VERSION
          web_digest=$(docker buildx imagetools inspect "$web" --format '{{json .Manifest}}' | jq -r .digest)
          api_digest=$(docker buildx imagetools inspect "$api" --format '{{json .Manifest}}' | jq -r .digest)
          render_digest=$(docker buildx imagetools inspect "$render" --format '{{json .Manifest}}' | jq -r .digest)
          transcription_digest=$(docker buildx imagetools inspect "$transcription" --format '{{json .Manifest}}' | jq -r .digest)
          {
            echo "RELEASE_VERSION=$VERSION"
            echo "RELEASE_COMMIT=$GITHUB_SHA"
            echo "WEB_IMAGE=$web@$web_digest"
            echo "API_IMAGE=$api@$api_digest"
            echo "RENDER_IMAGE=$render@$render_digest"
            echo "TRANSCRIPTION_IMAGE=$transcription@$transcription_digest"
            echo "LOCAL_IMAGE_TAG=sha-$SHORT_SHA"
          } > artifacts/production-images.env
          (cd artifacts && sha256sum * > SHA256SUMS)
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --draft \
            --verify-tag \
            --title "InfoSteed $VERSION" \
            --notes "Release candidate for InfoSteed $VERSION. Review the attached checksums, deployment files, and image references before publishing this draft."
