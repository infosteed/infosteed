name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm format:check
      - run: corepack pnpm spdx:check
      - run: corepack pnpm notices:check
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build
      - run: corepack pnpm audit --prod --audit-level high
      - run: corepack pnpm extension:package -- --allow-unsigned-development
      - uses: anchore/sbom-action@v0
        with:
          path: apps/extension/dist
          format: cyclonedx-json
          output-file: artifacts/extension.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: extension-development-artifacts
          path: artifacts/

  transcription:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: whisper/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: whisper
      - run: python -m unittest test_app.py
        working-directory: whisper

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker compose --env-file docker.env.example config --quiet
      - run: docker compose --env-file docker.env.example --profile transcription --profile voiceover config --quiet
      - run: >-
          CADDY_IMAGE=caddy:2.10.2@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WEB_IMAGE=example/web:0.1.0-beta.1@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          API_IMAGE=example/api:0.1.0-beta.1@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          RENDER_IMAGE=example/render:0.1.0-beta.1@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          POSTGRES_IMAGE=postgres:16-alpine@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          MINIO_IMAGE=minio/minio:latest@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          MINIO_MC_IMAGE=minio/mc:latest@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TRANSCRIPTION_IMAGE=example/transcription:0.1.0-beta.1@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          KOKORO_IMAGE=example/kokoro:v0.2.4@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          APP_DOMAIN=guides.example.test ACME_EMAIL=admin@example.test
          APP_SOURCE_URL=https://github.com/example/project RELEASE_VERSION=0.1.0-beta.1 RELEASE_COMMIT=abc
          EXTENSION_ORIGINS=chrome-extension://abcdefghijklmnop
          SETUP_TOKEN=01234567890123456789012345678901
          POSTGRES_PASSWORD=test-password MINIO_ROOT_USER=root MINIO_ROOT_PASSWORD=test-root-password
          S3_ACCESS_KEY_ID=app S3_SECRET_ACCESS_KEY=test-app-password
          docker compose -f deploy/compose.production.yml --profile transcription-gpu --profile voiceover-cpu config --quiet

  containers:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: video-render-worker
            dockerfile: apps/video-render-worker/Dockerfile
          - name: transcription
            dockerfile: whisper/Dockerfile
            context: whisper
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context || '.' }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: local/${{ matrix.name }}:ci
          outputs: type=oci,dest=/tmp/${{ matrix.name }}.tar
      - uses: anchore/sbom-action@v0
        with:
          file: /tmp/${{ matrix.name }}.tar
          format: cyclonedx-json
          output-file: /tmp/${{ matrix.name }}.cdx.json
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          input: /tmp/${{ matrix.name }}.tar
          format: sarif
          output: /tmp/${{ matrix.name }}-trivy.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-supply-chain
          path: |
            /tmp/${{ matrix.name }}.tar
            /tmp/${{ matrix.name }}.cdx.json
            /tmp/${{ matrix.name }}-trivy.sarif

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: corepack enable && corepack pnpm install --frozen-lockfile
      - run: docker compose --env-file docker.env.example up -d --build --wait
      - run: corepack pnpm e2e
        env:
          INFOSTEED_API_URL: http://127.0.0.1:8080/api
          INFOSTEED_SETUP_TOKEN: local-development-setup-token-0001
      - if: always()
        run: docker compose --env-file docker.env.example logs --no-color
      - if: always()
        run: docker compose --env-file docker.env.example down -v

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
