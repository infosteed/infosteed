name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      compose: ${{ steps.classify.outputs.compose }}
      integration: ${{ steps.classify.outputs.integration }}
      python: ${{ steps.classify.outputs.python }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: classify
        name: Classify changed paths
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          .github/scripts/classify-paths.test.sh
          base=$PR_BASE_SHA
          if [[ -z $base ]]; then base=$BEFORE_SHA; fi
          if [[ -z $base || $base =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            if git rev-parse HEAD^ >/dev/null 2>&1; then
              base=$(git rev-parse HEAD^)
            else
              base=$(git hash-object -t tree /dev/null)
            fi
          fi

          mapfile -d '' -t paths < <(git diff --name-only -z "$base" "$GITHUB_SHA")
          .github/scripts/classify-paths.sh "${paths[@]}" >> "$GITHUB_OUTPUT"

  application:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: corepack pnpm format:check
      - run: corepack pnpm spdx:check
      - run: corepack pnpm release-metadata:check
      - run: corepack pnpm notices:check
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: corepack pnpm build

  transcription:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: whisper/requirements.txt
      - run: python -m pip install -r requirements.txt
        working-directory: whisper
      - run: python -m unittest test_app.py
        working-directory: whisper

  compose:
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: bash -n scripts/*.sh
      - run: scripts/test-production-scripts.sh
      - run: docker compose --env-file docker.env.example config --quiet
      - run: docker compose --env-file docker.env.example --profile transcription --profile voiceover config --quiet
      - run: >-
          CADDY_IMAGE=caddy:2.10.2@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WEB_IMAGE=example/web:0.1.0-beta.13@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          API_IMAGE=example/api:0.1.0-beta.13@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          RENDER_IMAGE=example/render:0.1.0-beta.13@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          POSTGRES_IMAGE=postgres:16-alpine@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          MINIO_IMAGE=minio/minio:latest@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          MINIO_MC_IMAGE=minio/mc:latest@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          TRANSCRIPTION_IMAGE=example/transcription:0.1.0-beta.13@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          KOKORO_IMAGE=example/kokoro:v0.2.4@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          OLLAMA_IMAGE=example/ollama:0.32.3@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          APP_DOMAIN=guides.example.test ACME_EMAIL=admin@example.test
          APP_SOURCE_URL=https://github.com/example/project RELEASE_VERSION=0.1.0-beta.13 RELEASE_COMMIT=abc
          EXTENSION_ORIGINS=chrome-extension://abcdefghijklmnop
          SETUP_TOKEN=01234567890123456789012345678901
          POSTGRES_PASSWORD=test-password MINIO_ROOT_USER=root MINIO_ROOT_PASSWORD=test-root-password
          S3_ACCESS_KEY_ID=app S3_SECRET_ACCESS_KEY=test-app-password
          TRANSCRIPTION_API_KEY=test-token
          docker compose -f deploy/compose.production.yml --profile llm-local --profile transcription-local --profile voiceover-local config --quiet
      - run: >-
          IMAGE_SOURCE=build LOCAL_IMAGE_TAG=sha-abc
          APP_DOMAIN=guides.example.test ACME_EMAIL=admin@example.test
          APP_SOURCE_URL=https://github.com/infosteed/infosteed RELEASE_VERSION=0.1.0-beta.13 RELEASE_COMMIT=abc
          EXTENSION_ORIGINS=chrome-extension://abcdefghijklmnopabcdefghijklmnop
          SETUP_TOKEN=01234567890123456789012345678901
          POSTGRES_PASSWORD=test-password MINIO_ROOT_USER=root MINIO_ROOT_PASSWORD=test-root-password
          S3_ACCESS_KEY_ID=app S3_SECRET_ACCESS_KEY=test-app-password
          docker compose -f deploy/compose.production.yml -f deploy/compose.build.yml
          --profile transcription-gpu --profile voiceover-cpu config --quiet
      - name: Validate standalone AI service Compose
        run: >-
          AI_BIND_ADDRESS=192.0.2.20 RELEASE_VERSION=0.1.0-beta.13 TRANSCRIPTION_API_KEY=test-token
          docker compose -f deploy/compose.ai-services.yml
          --profile ollama --profile transcription --profile voiceover config --quiet
      - name: Validate Caddy configurations
        run: |
          docker run --rm -e APP_DOMAIN=guides.example.test -e ACME_EMAIL=admin@example.test \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e APP_DOMAIN=guides.example.test \
            -v "$PWD/deploy/Caddyfile.internal:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb caddy validate --config /etc/caddy/Caddyfile
      - name: Smoke test production data services
        env:
          APP_DOMAIN: guides.example.test
          ACME_EMAIL: admin@example.test
          APP_SOURCE_URL: https://github.com/infosteed/infosteed
          RELEASE_VERSION: 0.1.0-beta.13
          RELEASE_COMMIT: abc
          EXTENSION_ORIGINS: chrome-extension://abcdefghijklmnopabcdefghijklmnop
          SETUP_TOKEN: 01234567890123456789012345678901
          POSTGRES_PASSWORD: test-database-password
          MINIO_ROOT_USER: test-root
          MINIO_ROOT_PASSWORD: test-root-password
          S3_ACCESS_KEY_ID: test-app
          S3_SECRET_ACCESS_KEY: test-app-password
        run: |
          docker compose -f deploy/compose.production.yml up -d --wait --wait-timeout 120 postgres minio
          docker compose -f deploy/compose.production.yml run --rm minio-init
          docker compose -f deploy/compose.production.yml exec -T postgres pg_isready -U app -d app
      - if: always()
        env:
          APP_DOMAIN: guides.example.test
          ACME_EMAIL: admin@example.test
          APP_SOURCE_URL: https://github.com/infosteed/infosteed
          RELEASE_VERSION: 0.1.0-beta.13
          RELEASE_COMMIT: abc
          EXTENSION_ORIGINS: chrome-extension://abcdefghijklmnopabcdefghijklmnop
          SETUP_TOKEN: 01234567890123456789012345678901
          POSTGRES_PASSWORD: test-database-password
          MINIO_ROOT_USER: test-root
          MINIO_ROOT_PASSWORD: test-root-password
          S3_ACCESS_KEY_ID: test-app
          S3_SECRET_ACCESS_KEY: test-app-password
        run: docker compose -f deploy/compose.production.yml down -v

  integration:
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-pnpm
      - run: docker compose --env-file docker.env.example up -d --build --wait
      - run: corepack pnpm e2e
        env:
          INFOSTEED_API_URL: http://127.0.0.1:8080/api
          INFOSTEED_SETUP_TOKEN: local-development-setup-token-0001
      - if: always()
        run: docker compose --env-file docker.env.example logs --no-color
      - if: always()
        run: docker compose --env-file docker.env.example down -v

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Scan changed commits for secrets
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$PR_BASE_SHA
          if [[ -z $base ]]; then base=$BEFORE_SHA; fi
          args=(git --redact --no-banner)
          if [[ -n $base && ! $base =~ ^0+$ ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            args+=(--log-opts="$base..$GITHUB_SHA")
          fi
          docker run --rm \
            --volume "$PWD:/repo" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            "${args[@]}" /repo
